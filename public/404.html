@font-face{font-family:"Cinzel";font-style:normal;font-weight:400 900;font-display:swap;src:url("/assets/fonts/cinzel-latin-wght-normal.woff2") format("woff2")}
:root{--night:#10161a;--stone-2:#1f292f;--line:#2f3d45;--text:#f1ece0;--muted:#aab3b0;--gold:#e9bc5c;--gold-hi:#ffdc8f;--gold-ink:#2a1d05;--teal:#4fe0cf;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

img{width:72px;height:72px;border-radius:14px}
.code{margin:0;font-family:Cinzel,Georgia,serif;font-weight:900;font-size:56px;line-height:1;color:var(--gold)}
